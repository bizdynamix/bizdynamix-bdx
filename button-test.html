<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg: #09090f;
      --violet: #7c6cf5;
      --violet-rgb: 124, 108, 245;
      --ease: cubic-bezier(.4, 0, .2, 1);
    }
    body { background: var(--bg); font-family: sans-serif; padding: 40px; }
    
    .btn-outline {
      border: 2px solid var(--violet);
      color: var(--violet);
      padding: 15px 34px;
      border-radius: 50px;
      font-weight: 600;
      font-size: .95rem;
      transition: .25s var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    
    .btn-outline:hover {
      background: var(--violet);
      color: #fff;
      box-shadow: 0 8px 32px rgba(var(--violet-rgb), .35);
      transform: translateY(-2px);
    }
    
    .cta-call {
      background: var(--violet);
      color: #fff;
      padding: 15px 32px;
      border-radius: 50px;
      font-weight: 600;
      font-size: .95rem;
      transition: .25s var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      cursor: pointer;
    }
    
    .cta-call:hover {
      background: #fff;
      color: var(--violet);
      box-shadow: 0 8px 32px rgba(var(--violet-rgb), .35);
      transform: translateY(-2px);
    }
    
    .section {
      margin: 40px 0;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
    }
    
    h3 { color: #fff; margin-top: 0; }
  </style>
</head>
<body>
  <h1 style="color: #00e5c8;">BizDynamix Button Test</h1>
  
  <div class="section">
    <h3>Outline Button (btn-outline)</h3>
    <button class="btn-outline">💬 Chat with Us</button>
    <p style="color: #999; font-size: 0.9rem;">Violet border, fills on hover</p>
  </div>
  
  <div class="section">
    <h3>Call-to-Action Button (cta-call)</h3>
    <button class="cta-call">💬 Chat with Us</button>
    <p style="color: #999; font-size: 0.9rem;">Violet background, white text, inverts on hover</p>
  </div>
  
  <div class="section">
    <h3>Both Buttons Together</h3>
    <button class="btn-outline">💬 Chat with Us</button>
    <button class="cta-call" style="margin-left: 10px;">💬 Chat with Us</button>
  </div>
</body>
</html>
