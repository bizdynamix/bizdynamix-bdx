<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDX Chat Widget — Demo</title>
  <style>
    body { margin: 0; font-family: -apple-system, sans-serif; background: #09090f; color: #eeeef6; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 24px; padding: 40px; }
    h1 { font-size: 2rem; color: #00e5c8; }
    p { color: #9ca3af; max-width: 480px; text-align: center; line-height: 1.7; }
    code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #00e5c8; }
    button { padding: 12px 28px; background: #00e5c8; border: none; border-radius: 50px; color: #000; font-weight: 700; cursor: pointer; font-size: 1rem; }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <h1>BDX Chat Widget</h1>
  <p>The floating chat button is in the bottom-right corner. Or click the button below to open it programmatically via <code>window.BdxChat.open()</code>.</p>
  <button onclick="window.BdxChat && window.BdxChat.open()">Open Chat</button>
  <p style="font-size:13px">Config: <code>data-api</code> · <code>data-site</code> · <code>data-name</code> · <code>data-label</code> · <code>data-greeting</code> · <code>data-primary</code> · <code>data-bg</code></p>

  <!-- Widget — just this one script tag needed on any site -->
  <script
    src="./widget.js"
    data-api="/api/chat"
    data-site="bdx"
    data-name="Sarah"
    data-label="BizDynamix AI"
    data-greeting="Hey there 👋 I'm Sarah from BizDynamix. I can answer your questions and help figure out if we're a good fit. What brings you here today?"
    data-primary="#00e5c8"
    data-bg="#111119"
  ></script>
</body>
</html>
